<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MarketNode</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}.app{min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px}.user{display:flex;align-items:center;gap:10px;color:#667085}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:235px;background:#fff;border-right:1px solid #e5e7eb;padding:24px 14px}.nav-title{font-size:11px;text-transform:uppercase;color:#98a2b3;font-weight:700;margin:0 10px 8px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;color:#475467;margin:2px 0}.nav button.active{background:#eef2ff;color:#3730a3;font-weight:700}.main{flex:1;padding:30px;max-width:1250px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.section-head h1{margin:0;font-size:28px}.muted{color:#667085}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;box-shadow:0 1px 2px #00000008}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.product-card{cursor:pointer;transition:.15s}.product-card:hover{transform:translateY(-1px);box-shadow:0 8px 20px #0000000d}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}.green{background:#ecfdf3;color:#027a48}.red{background:#fef3f2;color:#b42318}.blue{background:#eef4ff;color:#3538cd}.price{font-size:22px;font-weight:800;margin:10px 0}.btn{border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}.btn:hover{background:#f9fafb}.btn.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}.btn.danger{color:#b42318;border-color:#fecdca}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:13px;font-weight:700;color:#344054}.field input,.field select,.field textarea{border:1px solid #d0d5dd;border-radius:8px;padding:9px 11px;background:#fff}.field textarea{min-height:90px;resize:vertical}.detail{max-width:720px}.detail h2{margin-top:0;font-size:28px}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #f0f1f3}.row:last-child{border-bottom:0}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}.table th,.table td{padding:13px 14px;text-align:left;border-bottom:1px solid #eef0f3}.table th{font-size:12px;color:#667085;text-transform:uppercase;background:#fafafa}.table tr:last-child td{border-bottom:0}.table button{border:0;background:none;color:#4338ca;cursor:pointer}.notice{padding:11px 13px;border-radius:8px;margin-bottom:14px;background:#fef3f2;color:#b42318}.success{background:#ecfdf3;color:#027a48}.toolbar{display:flex;gap:10px;align-items:center}.toolbar input{border:1px solid #d0d5dd;border-radius:8px;padding:9px 11px}.modal-backdrop{position:fixed;inset:0;background:#10182899;display:flex;align-items:center;justify-content:center;z-index:20}.modal{background:#fff;width:min(560px,calc(100vw - 30px));max-height:90vh;overflow:auto;border-radius:14px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.close{border:0;background:none;font-size:24px;cursor:pointer}.empty{padding:45px;text-align:center;color:#667085}.qty{display:flex;align-items:center;gap:8px}.qty input{width:80px;text-align:center;border:1px solid #d0d5dd;border-radius:8px;padding:9px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:800px){aside{display:none}.main{padding:18px}.split{grid-template-columns:1fr}.top{padding:0 16px}}
</style></head>
<body><div id="root"></div>
<script>
const users=[{id:1,name:'Alice Martin',email:'alice@marketnode.com'},{id:2,name:'Bob Chen',email:'bob@marketnode.com'},{id:3,name:'Carol Smith',email:'carol@marketnode.com'}];
let state={section:'ims-products',product:null,order:null,user:users[0],products:[],orders:[],notice:null};
const root=document.getElementById('root');
const money=v=>'$'+Number(v||0).toFixed(2); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let body=null;try{body=await r.json()}catch{}if(!r.ok)throw new Error(body?.error||body?.message||`Request failed (${r.status})`);return body}
function layout(content){root.innerHTML=`<div class="app"><header class="top"><div class="brand">MarketNode</div><div class="user"><span>${esc(state.user.email)}</span><select id="userSelect">${users.map(u=>`<option value="${u.id}" ${u.id===state.user.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div></header><div class="layout"><aside><p class="nav-title">Inventory Management</p><div class="nav"><button class="${state.section.startsWith('ims')?'active':''}" onclick="go('ims-products')">Products</button></div><p class="nav-title" style="margin-top:25px">Order Management</p><div class="nav"><button class="${state.section.startsWith('store')?'active':''}" onclick="go('store-products')">Product Catalog</button><button class="${state.section.startsWith('orders')?'active':''}" onclick="go('orders')">Order History</button></div></aside><main class="main">${state.notice?`<div class="notice ${state.notice.type==='success'?'success':''}">${esc(state.notice.text)}</div>`:''}${content}</main></div></div>`;document.getElementById('userSelect').onchange=e=>{state.user=users.find(u=>u.id==e.target.value)||users[0];state.notice=null;render()};}
function go(section,id=null){state.section=section;state.product=id;state.order=id;state.notice=null;render()}
async function render(){try{if(state.section==='ims-products')return renderImsList();if(state.section==='ims-detail')return renderImsDetail();if(state.section==='store-products')return renderStore();if(state.section==='store-detail')return renderStoreDetail();if(state.section==='orders')return renderOrders();if(state.section==='order-detail')return renderOrderDetail();}catch(e){state.notice={text:e.message,type:'error'};layout(`<div class="empty">Unable to load this screen.</div>`)} }
async function renderImsList(){const products=await api('/api/products');state.products=products;layout(`<div class="section-head"><div><h1>Products</h1><p class="muted">Staff catalog and inventory</p></div><button class="btn primary" onclick="openProductModal()">+ Add Product</button></div><div class="card" style="padding:0;overflow:auto"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Description</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody>${products.length?products.map(p=>`<tr><td>${p.id}</td><td><button onclick="go('ims-detail',${p.id})">${esc(p.name)}</button></td><td>${esc(p.category)}</td><td>${esc(p.description||'—')}</td><td>${money(p.price)}</td><td><span class="pill ${p.stock>0?'green':'red'}">${p.stock}</span></td><td><button class="btn danger" onclick="deleteProduct(${p.id})">Delete</button></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">No products yet.</div></td></tr>`}</tbody></table></div>`)}
async function renderImsDetail(){const p=await api('/api/products/'+state.product);layout(`<div class="actions" style="margin-bottom:15px"><button class="btn" onclick="go('ims-products')">← Back</button></div><div class="detail"><div class="card"><div class="section-head"><h2>${esc(p.name)}</h2><span class="pill ${p.stock?'green':'red'}">Stock: ${p.stock}</span></div><div class="row"><b>Category</b><span>${esc(p.category)}</span></div><div class="row"><b>Description</b><span>${esc(p.description||'—')}</span></div><div class="row"><b>Price</b><span>${money(p.price)}</span></div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick='openEditModal(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Edit</button></div></div><div class="card" style="margin-top:16px"><h3>Adjust Stock</h3><p class="muted">Increase with a positive amount or decrease with a negative amount. Stock cannot go below zero.</p><div class="toolbar"><input id="stockAmount" type="number" step="1" placeholder="e.g. 5 or -3"><button class="btn primary" onclick="adjustStock(${p.id})">Adjust</button></div></div></div>`)}
async function renderStore(){const products=await api('/api/store/products');state.products=products;layout(`<div class="section-head"><div><h1>Product Catalog</h1><p class="muted">Browse products available from MarketNode</p></div></div><div class="grid">${products.length?products.map(p=>`<div class="card product-card" onclick="go('store-detail',${p.id})"><span class="pill blue">${esc(p.category)}</span><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description||'No description available.')}</p><div class="price">${money(p.price)}</div><span class="pill ${p.inStock?'green':'red'}">${p.inStock?'In stock':'Out of stock'}</span></div>`).join(''):`<div class="empty">No products available.</div>`}</div>`)}
async function renderStoreDetail(){const p=await api('/api/store/products/'+state.product);layout(`<div class="actions" style="margin-bottom:15px"><button class="btn" onclick="go('store-products')">← Back to catalog</button></div><div class="detail card"><span class="pill blue">${esc(p.category)}</span><h2>${esc(p.name)}</h2><p class="muted">${esc(p.description||'No description available.')}</p><div class="row"><b>Price</b><span>${money(p.price)}</span></div><div class="row"><b>Availability</b><span class="pill ${p.inStock?'green':'red'}">${p.inStock?'In stock':'Out of stock'}</span></div><div style="margin-top:22px"><div class="field"><label>Quantity</label><div class="qty"><button class="btn" onclick="changeQty(-1)">−</button><input id="orderQty" type="number" min="1" max="999" value="1"><button class="btn" onclick="changeQty(1)">+</button></div></div><button class="btn primary" ${p.inStock?'':'disabled'} onclick="placeOrder(${p.id})">Place Order</button></div></div>`)}
function changeQty(delta){const i=document.getElementById('orderQty');i.value=Math.max(1,Math.min(999,Number(i.value||1)+delta))}
async function placeOrder(productId){try{const q=Number(document.getElementById('orderQty').value);const o=await api('/api/orders',{method:'POST',body:JSON.stringify({userId:state.user.id,productId,quantity:q})});state.notice={text:`Order #${o.id} placed successfully.`,type:'success'};state.section='order-detail';state.order=o.id;await renderOrderDetail()}catch(e){state.notice={text:e.message,type:'error'};await renderStoreDetail()}}
async function renderOrders(){const orders=await api('/api/orders?userId='+state.user.id);state.orders=orders;layout(`<div class="section-head"><div><h1>Order History</h1><p class="muted">Orders for ${esc(state.user.name)}</p></div></div><div class="card" style="padding:0;overflow:auto"><table class="table"><thead><tr><th>Order</th><th>Product</th><th>Quantity</th><th>Total</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody>${orders.length?orders.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.productName)}</td><td>${o.quantity}</td><td>${money(o.totalAmount)}</td><td><span class="pill ${o.status==='CREATED'?'green':'red'}">${o.status}</span></td><td>${new Date(o.createdAt).toLocaleString()}</td><td><button onclick="go('order-detail',${o.id})">View</button></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">No orders yet.</div></td></tr>`}</tbody></table></div>`)}
async function renderOrderDetail(){const o=await api('/api/orders/'+state.order);layout(`<div class="actions" style="margin-bottom:15px"><button class="btn" onclick="go('orders')">← Back to orders</button></div><div class="detail card"><div class="section-head"><h2>Order #${o.id}</h2><span class="pill ${o.status==='CREATED'?'green':'red'}">${o.status}</span></div><div class="row"><b>Product</b><span>${esc(o.productName)}</span></div><div class="row"><b>Quantity</b><span>${o.quantity}</span></div><div class="row"><b>Unit price</b><span>${money(o.unitPrice)}</span></div><div class="row"><b>Total amount</b><strong>${money(o.totalAmount)}</strong></div><div class="row"><b>Date placed</b><span>${new Date(o.createdAt).toLocaleString()}</span></div>${o.status==='CREATED'?`<div class="actions" style="margin-top:18px"><button class="btn danger" onclick="cancelOrder(${o.id})">Cancel Order</button></div>`:''}</div>`)}
async function cancelOrder(id){if(!confirm('Cancel this order and restore its stock?'))return;try{await api('/api/orders/'+id+'/cancel',{method:'PATCH'});state.notice={text:'Order cancelled and stock restored.',type:'success'};await renderOrderDetail()}catch(e){state.notice={text:e.message,type:'error'};await renderOrderDetail()}}
async function adjustStock(id){try{const amount=Number(document.getElementById('stockAmount').value);if(!Number.isInteger(amount)||amount===0)throw new Error('Enter a non-zero integer amount.');await api(`/api/products/${id}/stock?amount=${amount}`,{method:'PATCH'});state.notice={text:'Stock updated successfully.',type:'success'};await renderImsDetail()}catch(e){state.notice={text:e.message,type:'error'};await renderImsDetail()}}
async function deleteProduct(id){if(!confirm('Delete this product from the catalog? Existing orders will remain intact.'))return;try{await api('/api/products/'+id,{method:'DELETE'});state.notice={text:'Product deleted from the catalog.',type:'success'};await renderImsList()}catch(e){state.notice={text:e.message,type:'error'};await renderImsList()}}
function modal(inner){const d=document.createElement('div');d.className='modal-backdrop';d.innerHTML=`<div class="modal">${inner}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d);return d}
function openProductModal(existing=null){const p=existing||{name:'',category:'',description:'',price:''};const m=modal(`<div class="modal-head"><h2>${existing?'Edit Product':'Add Product'}</h2><button class="close">×</button></div><form id="productForm"><div class="field"><label>Name *</label><input id="pname" maxlength="255" required value="${esc(p.name)}"></div><div class="field"><label>Category *</label><select id="pcat" required>${['Electronics','Clothing','Home & Garden','Sports','Books','Other'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Description</label><textarea id="pdesc" maxlength="2000">${esc(p.description||'')}</textarea></div><div class="field"><label>Price *</label><input id="pprice" type="number" min="0" max="99999.99" step="0.01" required value="${p.price??''}"></div><div class="actions"><button type="button" class="btn" onclick="this.closest('.modal-backdrop').remove()">Cancel</button><button class="btn primary">Save</button></div></form>`);m.querySelector('.close').onclick=()=>m.remove();m.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const payload={name:document.getElementById('pname').value.trim(),category:document.getElementById('pcat').value,description:document.getElementById('pdesc').value,price:Number(document.getElementById('pprice').value)};await api(existing?'/api/products/'+existing.id:'/api/products',{method:existing?'PUT':'POST',body:JSON.stringify(payload)});m.remove();state.notice={text:existing?'Product updated successfully.':'Product created with zero stock.',type:'success'};await (existing?renderImsDetail():renderImsList())}catch(err){alert(err.message)}}}
function openEditModal(p){openProductModal(p)}
render();
</script></body></html>
